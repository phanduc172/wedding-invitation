<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Trang không tồn tại | Thiệp Cưới Minh Đức</title>

    <meta name="robots" content="noindex, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        background: #faf7f6;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #444;
        text-align: center;
      }

      .box {
        max-width: 420px;
        padding: 30px;
      }

      h1 {
        font-size: 64px;
        margin: 0;
        color: #b76e79;
      }

      p {
        margin: 15px 0 25px;
        font-size: 16px;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 10px 22px;
        border-radius: 30px;
        background: #b76e79;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
      }

      a:hover {
        opacity: 0.9;
      }
    </style>

    <script>
      // Redirect SPA for GitHub Pages (history mode)
      (function () {
        var redirect = location.pathname + location.search + location.hash;
        if (redirect !== '/') {
          sessionStorage.setItem('redirect', redirect);
        }
        location.replace('/');
      })();
    </script>
  </head>

  <body>
    <div class="box">
      <h1>404</h1>
      <p>
        Trang bạn tìm không tồn tại hoặc đã được thay đổi.<br />
        Đang chuyển về trang chủ…
      </p>
      <a href="/">Về trang chủ</a>
    </div>
  </body>
</html>
