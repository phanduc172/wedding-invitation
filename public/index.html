<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ================= SEO CƠ BẢN ================= -->
    <title>Thiệp Cưới Minh Đức | Thiệp Cưới Đẹp – Sang Trọng – Hiện Đại</title>

    <meta
      name="description"
      content="Thiệp Cưới Minh Đức chuyên thiết kế và in ấn thiệp cưới đẹp, tinh tế, chỉnh sửa nội dung theo yêu cầu. Giao hàng nhanh – giá hợp lý."
    />

    <meta
      name="keywords"
      content="thiệp cưới, thiệp cưới đẹp, thiệp cưới Minh Đức, in thiệp cưới Huế, thiệp cưới sang trọng"
    />

    <meta name="author" content="Thiệp Cưới Minh Đức" />
    <meta name="robots" content="index, follow" />

    <!-- ================= OPEN GRAPH (ZALO / FACEBOOK) ================= -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta
      property="og:title"
      content="Thiệp Cưới Minh Đức | Thiệp Cưới Đẹp – Sang Trọng"
    />
    <meta
      property="og:description"
      content="Thiết kế & in ấn thiệp cưới cao cấp, tinh tế. Chỉnh sửa nội dung theo yêu cầu – giao hàng nhanh."
    />
    <meta property="og:url" content="https://thiepcuoiminhduc.io.vn/" />
    <meta
      property="og:image"
      content="https://thiepcuoiminhduc.io.vn/seo-thumbnail.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- ================= TWITTER (KHÔNG BẮT BUỘC NHƯNG NÊN CÓ) ================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Thiệp Cưới Minh Đức | Thiệp Cưới Đẹp – Sang Trọng"
    />
    <meta
      name="twitter:description"
      content="Thiết kế & in ấn thiệp cưới đẹp, hiện đại, chỉnh sửa nội dung theo yêu cầu."
    />
    <meta
      name="twitter:image"
      content="https://thiepcuoiminhduc.io.vn/seo-thumbnail.jpg"
    />
    <meta property="og:site_name" content="Thiệp Cưới Minh Đức" />
    <meta name="theme-color" content="#b76e79" />
    <meta property="og:locale:alternate" content="vi_VN" />

    <!-- ================= FAVICON ================= -->
    <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
    <link rel="apple-touch-icon" href="<%= BASE_URL %>favicon.ico" />
    <link rel="canonical" href="https://thiepcuoiminhduc.io.vn/" />

    <!-- ================= BOOTSTRAP ICONS ================= -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Thiệp Cưới Minh Đức",
        "url": "https://thiepcuoiminhduc.io.vn/",
        "logo": "https://thiepcuoiminhduc.io.vn/seo-thumbnail.jpg",
        "image": "https://thiepcuoiminhduc.io.vn/seo-thumbnail.jpg",
        "description": "Thiết kế và in ấn thiệp cưới đẹp, sang trọng, chỉnh sửa nội dung theo yêu cầu.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Huế",
          "addressCountry": "VN"
        }
